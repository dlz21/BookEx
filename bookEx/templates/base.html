{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Book Exchange{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'dist/main.css' %}">
    <script type="module" src="{% static 'dist/main.js' %}"></script>
</head>
<body>
    <!-- Skip Link -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Top Banner -->
    <header class="pf-v6-c-masthead" id="masthead">
        <div class="pf-v6-c-masthead__main">
            <span class="pf-v6-c-masthead__toggle">
              <button
                class="pf-v6-c-button pf-m-hamburger pf-m-plain"
                type="button"
                id="navigation-toggle"
                aria-label="Toggle primary navigation"
                aria-controls="primary-navigation"
                aria-expanded="true"
                hidden
              >
                <span class="pf-v6-c-button__icon">
                  <svg
                    viewBox="0 0 10 10"
                    class="pf-v6-c-button--hamburger-icon pf-v6-svg"
                    width="1em"
                    height="1em"
                    aria-hidden="true"
                  >
                    <path class="pf-v6-c-button--hamburger-icon--top" d="M1,1 L9,1" />
                    <path class="pf-v6-c-button--hamburger-icon--middle" d="M1,5 L9,5" />
                    <path
                      class="pf-v6-c-button--hamburger-icon--arrow"
                      d="M1,5 L1,5 L1,5"
                    />
                    <path class="pf-v6-c-button--hamburger-icon--bottom" d="M9,9 L1,9" />
                  </svg>
                </span>
              </button>
            </span>
            <div class="pf-v6-c-masthead__brand">
              <a class="pf-v6-c-masthead__logo" href="{% url 'index' %}">Book Exchange</a>
            </div>
        </div>

        <!-- User -->
        <div class="pf-v6-c-masthead__content">
            {% include "includes/account_actions.html" %}
        </div>
    </header>

    {% include "includes/navigation.html" %}

    <!-- Main Layout -->
    <div class="container">

        <!-- Right Main Content -->
        <main id="main-content" tabindex="-1" class="content">
            {% block content %}
               <h1>Main Content</h1>
            {% endblock content %}
        </main>

    </div>

    <!-- Bottom Footer -->
    <footer class="pf-v6-c-page__footer footer">
        <div class="pf-v6-c-page__main-body">
            <p>&copy; {% now "Y" %} Book Exchange</p>
        </div>
      </footer>
</body>
</html>
