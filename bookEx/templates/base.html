<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Layout</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>

    <!-- Top Banner -->
    <header class="banner">
        <h1>Website Banner</h1>
    </header>

    <!-- Main Layout -->
    <div class="container">

        <!-- Left Menu -->
        <nav class="sidebar">
            <ul>
                {% block sidenav%}
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#service">Service</a></li>
                    <li><a href="#contact">Contact</a></li>
                {% endblock sidenav %}
            </ul>
        </nav>

        <!-- Right Main Content -->
        <main class="content">
            {% block content %}
               <h1>Main Content</h1>
            {% endblock content %}
        </main>

    </div>

    <!-- Bottom Footer -->
    <footer class="footer">
        <p>&copy; 2026 Your Company Name. All rights reserved.</p>
    </footer>

</body>
</html>
