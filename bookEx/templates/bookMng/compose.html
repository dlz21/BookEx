{% extends "base.html" %}
{% block title %}Compose message | Book Exchange{% endblock %}
{% block content %}
<section class="messaging-page pf-prototype pf-v6-c-card" aria-labelledby="compose-title">
  <div class="pf-v6-c-card__title"><h1 id="compose-title">Compose message</h1></div>
  <div class="pf-v6-c-card__body">
    <a href="{% url 'inbox' %}">Back to Inbox</a>
    {% url 'compose_message' as compose_url %}
    {% include "includes/message_form.html" with action_url=compose_url submit_label="Send message" %}
  </div>
</section>
{% endblock %}
